[project]
name = "messaging"
version = "0.1.0"
description = "Надёжный обмен сообщениями через Kafka: outbox, relay и идемпотентный консьюмер"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.15.0",
    "contracts",
    "sqlalchemy[asyncio]>=2.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
contracts = { workspace = true }
