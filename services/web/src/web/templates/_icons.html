{# Простые контурные иконки вместо фотографий: фото товаров защищены авторским правом. #}
{% macro device_icon(category, size=96) %}
<svg class="device-icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if category == "iphone" %}
    <rect x="15" y="5" width="18" height="38" rx="4"/><line x1="21" y1="9" x2="27" y2="9"/>
  {% elif category == "ipad" %}
    <rect x="9" y="6" width="30" height="36" rx="3"/><circle cx="24" cy="38" r="0.8"/>
  {% else %}
    <rect x="9" y="11" width="30" height="20" rx="2"/><path d="M4 35h40l-3 3H7z"/>
  {% endif %}
</svg>
{% endmacro %}
